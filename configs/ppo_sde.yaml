# Thử nghiệm 1: PPO + gSDE (nhiễu phụ thuộc trạng thái theo block 8 bước = 2h) + Normalize Reward
agent:
  algorithm: ppo
  backend: sb3
  observation_dim: 7
  action_dim: 1
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
  activation: tanh
  n_envs: 8
  n_steps: 480
  batch_size: 256
  n_epochs: 5
  learning_rate: 0.0003
  lr_schedule: linear
  gamma: 0.99
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.001
  vf_coef: 1.0
  max_grad_norm: 0.5
  target_kl: 0.02
  normalize_reward: true
  clip_action_eval: true
  use_sde: true
  sde_sample_freq: 8
  log_std_init: -0.7

training:
  total_timesteps: 300000
  seeds: [0, 1, 2, 3, 4]
  eval_freq: 10000
  eval_days: 54
  log_freq: 3840
  torch_threads: 1

evaluation:
  initial_soc: 0.5
  pv_scale_cloudy: 0.5
  sigma_load: 0.08
  sigma_pv: 0.15
