# Cấu hình SAC của Nguyễn Văn Trường. Giữ bản gốc để đối chiếu các lần chạy.
agent:
  observation_dim: 7
  action_dim: 1
  hidden_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_size: 200000
  learning_starts: 5000
  initial_alpha: 1.0
  target_entropy: -1.0

training:
  total_timesteps: 300000
  seeds: [0, 1, 2, 3, 4]
  eval_freq: 10000
  eval_days: 54                # Đánh giá toàn bộ validation; test chỉ chạy khi yêu cầu.
  log_freq: 1000
  torch_threads: 1            # Mạng nhỏ: tránh chi phí tạo quá nhiều luồng CPU.

evaluation:
  initial_soc: 0.5            # Cùng mức pin cho mọi phương pháp trên cùng ngày.
  pv_scale_cloudy: 0.5        # S3 thực sự giảm PV trong cân bằng công suất.
  sigma_load: 0.08            # S4 chỉ nhiễu quan sát, không đổi tải vật lý.
  sigma_pv: 0.15
