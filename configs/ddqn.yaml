# Cấu hình Double DQN + Dueling của Lý Đình Sơn (Thuật toán 4, báo cáo TH2).
# Mục training/evaluation giữ giống configs/sac.yaml để so sánh công bằng.
agent:
  observation_dim: 7
  num_actions: 11             # a = -1 + 2k/(K-1); k = 5 là pin nghỉ
  hidden_size: 256
  learning_rate: 0.0001
  gamma: 0.99
  tau: 0.005                  # Cập nhật mềm mạng đích sau mỗi lần update
  batch_size: 256
  buffer_size: 200000
  learning_starts: 5000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 50000  # Tính theo bước môi trường toàn cục
  grad_clip_norm: 10.0
  double: true
  dueling: true

training:
  total_timesteps: 300000
  seeds: [0, 1, 2, 3, 4]
  eval_freq: 10000
  eval_days: 54                # Đánh giá toàn bộ validation; test chỉ chạy khi yêu cầu.
  log_freq: 1000
  torch_threads: 1

evaluation:
  initial_soc: 0.5            # Cùng mức pin cho mọi phương pháp trên cùng ngày.
  pv_scale_cloudy: 0.5        # S3 thực sự giảm PV trong cân bằng công suất.
  sigma_load: 0.08            # S4 chỉ nhiễu quan sát, không đổi tải vật lý.
  sigma_pv: 0.15
